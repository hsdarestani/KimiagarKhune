name: Diagnose plan access

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose target advisor identity and assignment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -eu
            set -a
            . /etc/kimiagarkhune.env
            set +a
            cd /var/www/KimiagarKhune
            ./venv/bin/python manage.py shell <<'PY'
            from django.db.models import Q
            from accounts.models import Advisor, Profile, Student
            from plans.models import Course
            from plans.advisor_access import assigned_students_for_advisor, effective_advisor_id, user_can_access_student

            student = Student.objects.select_related('profile', 'advisor__profile').get(pk=54)
            profiles = Profile.objects.select_related('user').filter(
                Q(first_name__icontains='حسین')
                | Q(last_name__icontains='حسین')
                | Q(first_name__icontains='محمد')
                | Q(last_name__icontains='محمد')
            ).order_by('pk')

            print('=== TARGET ADVISOR DIAGNOSTIC ===')
            print('STUDENT', {
                'id': student.pk,
                'name': student.profile.get_full_name(),
                'advisor_id': student.advisor_id,
                'advisor_name': student.advisor.profile.get_full_name() if student.advisor_id else None,
                'effective_advisor_id': effective_advisor_id(student),
                'courses': list(Course.objects.filter(student=student).values('id', 'advisor_id', 'is_active')),
            })
            print('PROFILE_MATCHES', profiles.count())
            for profile in profiles:
                advisor = Advisor.objects.filter(profile=profile).first()
                full_name = profile.get_full_name()
                if 'حسین' not in full_name and 'محمد' not in full_name:
                    continue
                print('PROFILE', {
                    'profile_id': profile.pk,
                    'first_name': profile.first_name,
                    'last_name': profile.last_name,
                    'full_name': full_name,
                    'role': profile.role,
                    'user_id': profile.user_id,
                    'username': profile.user.username,
                    'is_staff': profile.user.is_staff,
                    'advisor_id': advisor.pk if advisor else None,
                    'can_access_saha': user_can_access_student(profile.user, student) if advisor else False,
                })
            print('ALL_ADVISORS')
            for advisor in Advisor.objects.select_related('profile__user').order_by('pk'):
                profile = advisor.profile
                print('ADVISOR', {
                    'advisor_id': advisor.pk,
                    'profile_id': profile.pk,
                    'full_name': profile.get_full_name(),
                    'role': profile.role,
                    'username': profile.user.username,
                    'is_staff': profile.user.is_staff,
                    'has_saha': assigned_students_for_advisor(advisor).filter(pk=student.pk).exists(),
                })
            print('=== END TARGET ADVISOR DIAGNOSTIC ===')
            PY
